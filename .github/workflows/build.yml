name: CI
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Downloading dependencies...
        run: pnpm install --frozen-lockfile
        working-directory: ./web
      - name: Type-checking...
        run: pnpm type-check
        working-directory: ./web
      - name: Building...
        run: pnpm build
        working-directory: ./web
      - name: Linting...
        run: pnpm lint
        working-directory: ./web

  gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: gateway/go.sum
      - name: Downloading dependencies...
        run: go mod download
        working-directory: ./gateway
      - name: Verifying...
        run: go mod verify
        working-directory: ./gateway
      - name: Building...
        run: go build ./...
        working-directory: ./gateway
      - name: Vet...
        run: go vet ./...
        working-directory: ./gateway
      - name: Testing...
        run: go test ./... -race -count=1 -cover
        working-directory: ./gateway
      - name: Install staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Linting...
        run: make lint
        working-directory: ./gateway

  secret_assistant:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.18.0"
          cache-dependency-path: secret_assistant/go.sum
      - name: Downloading dependencies...
        run: go mod download
        working-directory: ./secret_assistant
      - name: Verifying...
        run: go mod verify
        working-directory: ./secret_assistant
      - name: Building...
        run: go build ./...
        working-directory: ./secret_assistant
      - name: Testing...
        run: go test ./...
        working-directory: ./secret_assistant
      - name: Vet...
        run: go vet ./...
        working-directory: ./secret_assistant

  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose config --quiet
      - name: Validate production compose
        run: docker compose -f docker-compose.prod.yml config --quiet
