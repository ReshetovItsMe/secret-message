name: Feature request
description: Propose a new feature or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please describe the problem you are solving
        and the solution you have in mind.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behaviour you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches have you considered, and why were they rejected?
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in scope and out of scope for this change?
    validations:
      required: false
