version: "3.6"

services:
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - redis
      - secret-assistant
      - gateway
    networks:
      - frontend-network
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    expose:
      - "3000"
    networks:
      - frontend-network
      - backend-network
    depends_on:
      - redis
      - secret-assistant
  secret-assistant:
    build:
      context: ./secret_assistant
      dockerfile: Dockerfile
    ports:
      - "50052:50052"
    expose:
      - "50052"
    environment:
      RSA_PRIVATE_KEY_PATH: /run/secrets/secret_assistant_private_key
    secrets:
      - secret_assistant_private_key
    networks:
      - backend-network
  redis:
    image: redis:7-bullseye
    restart: always
    ports:
      - "6379:6379"
    expose:
      - "6379"
    networks:
      - backend-network

# Service private key (RSA-2048) for secret-assistant. Generate a synthetic key
# once for local development and keep the real file out of version control:
#   mkdir -p secrets
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
#     -out secrets/secret-assistant-private-key.pem
# The file is mounted read-only into the container as a Docker secret;
# secret-assistant reads its path from RSA_PRIVATE_KEY_PATH.
secrets:
  secret_assistant_private_key:
    file: ./secrets/secret-assistant-private-key.pem

networks:
  frontend-network:
  backend-network:
