services:
  frontend:
    image: reshetovitsme/secret-frontend:${IMAGE_TAG:?set_IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:80"
    expose:
      - "80"
    depends_on:
      - redis
      - secret-assistant
      - gateway
    networks:
      - frontend-network
  gateway:
    image: reshetovitsme/secret-gateway:${IMAGE_TAG:?set_IMAGE_TAG}
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - redis
      - secret-assistant
    networks:
      - frontend-network
      - backend-network
  secret-assistant:
    image: reshetovitsme/secret-assistant:${IMAGE_TAG:?set_IMAGE_TAG}
    restart: unless-stopped
    expose:
      - "50052"
    environment:
      RSA_PRIVATE_KEY_PATH: /run/secrets/secret_assistant_private_key
    secrets:
      - secret_assistant_private_key
    networks:
      - backend-network
  redis:
    image: redis:7-bullseye
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - backend-network

# The RSA key lives in a protected host file outside this repository.
# Preserve this exact key across deployments to read existing encrypted messages.
secrets:
  secret_assistant_private_key:
    file: ${RSA_PRIVATE_KEY_FILE:?set_RSA_PRIVATE_KEY_FILE}

volumes:
  redis_data:

networks:
  frontend-network:
  backend-network:
